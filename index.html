<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Research Methods — 目錄</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
  <style>
    body{font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans TC', 'Microsoft JhengHei', Arial; color:#222; background:#f6f7fb}
    .wrap{max-width:1100px;margin:28px auto;padding:20px;background:#fff;border-radius:8px;box-shadow:0 6px 18px rgba(35,40,55,0.08)}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
    h1{font-size:20px;margin:0}
    .cols{display:grid;grid-template-columns:320px 1fr;gap:20px}
    .panel{border:1px solid #eef2f6;padding:12px;border-radius:6px;background:#fcfdff}
    .list{list-style:none;padding:0;margin:0}
    .list li{padding:6px 8px;border-radius:4px;display:flex;align-items:center;gap:12px}
    .list li:hover{background:#f1f6fb}
    .dir{font-weight:600}
    /* 讓左側區塊可縮放並自動換行，避免遮蓋右側按鈕 */
    .list li > div:first-child{flex:1;min-width:0;display:flex;flex-direction:column}
    .list li > div:last-child{flex:0 0 auto;white-space:nowrap}
    .list li span{display:block;overflow-wrap:break-word;word-break:break-word}
    .meta{font-size:12px;color:#6b7280}
    a.file-link{color:#0b5fff;text-decoration:none}
    .readme{padding:16px}
    .small-btn{background:#eef6ff;border:1px solid #d6eaff;padding:4px 8px;border-radius:6px;font-size:12px}
    .empty{color:#6b7280;font-size:14px;padding:12px}
    footer{margin-top:14px;font-size:13px;color:#6b7280}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Research Methods — 目錄與 README</h1>
      <div class="meta">GitHub Pages: <a href="https://cjs930.github.io/Research-Methods/" target="_blank">cjs930.github.io/Research-Methods</a></div>
    </header>

    <div class="cols">
      <aside class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <strong>網站目錄</strong>
          <button id="refresh" class="small-btn">重新整理</button>
        </div>
        <div id="repo-info" class="meta">載入中…</div>
        <ul id="tree" class="list" aria-live="polite"></ul>
      </aside>

      <main class="panel">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <strong>README</strong>
          <div class="meta">最後更新會即時顯示</div>
        </div>
        <div id="readme" class="readme">載入 README.md…</div>
      </main>
    </div>

    <footer>版面參考: <a href="https://cjs930.github.io/Software-patents/index.html" target="_blank">Software-patents</a></footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const owner = 'cjs930';
    const repo = 'Research-Methods';
    const treeEl = document.getElementById('tree');
    const readmeEl = document.getElementById('readme');
    const repoInfoEl = document.getElementById('repo-info');
    const refreshBtn = document.getElementById('refresh');

    async function getDefaultBranch(){
      const r = await fetch(`https://api.github.com/repos/${owner}/${repo}`);
      if(!r.ok) throw new Error('無法取得 repo 資訊');
      const j = await r.json();
      return j.default_branch || 'main';
    }

    async function fetchContents(path='', branch){
      const api = `https://api.github.com/repos/${owner}/${repo}/contents/${path}?ref=${branch}`;
      const r = await fetch(api);
      if(!r.ok) throw new Error('無法讀取目錄: '+path);
      return await r.json();
    }

    function makeFileLink(path){
      return `https://cjs930.github.io/Research-Methods/${encodeURI(path)}`;
    }

    function makeGitHubBlobLink(path, branch){
      return `https://github.com/${owner}/${repo}/blob/${branch}/${encodeURI(path)}`;
    }

    function renderList(items, parentEl, branch){
      items.sort((a,b)=> (a.type===b.type)? a.name.localeCompare(b.name): (a.type==='dir'? -1:1));
      items.forEach(item=>{
        const li = document.createElement('li');
        const left = document.createElement('div');
        left.style.display='flex';left.style.flexDirection='column';
        const titleRow = document.createElement('div');
        const name = document.createElement('span');
        name.textContent = item.name;
        if(item.type==='dir') name.className='dir';
        titleRow.appendChild(name);
        left.appendChild(titleRow);
        const sub = document.createElement('div');
        sub.className='meta';
        sub.textContent = item.type === 'dir' ? '資料夾' : item.size ? (Math.round(item.size/1024)+' KB') : '';
        left.appendChild(sub);
        li.appendChild(left);

        const right = document.createElement('div');
        if(item.type === 'dir'){
          const btn = document.createElement('button');
          btn.textContent = '展開';
          btn.className='small-btn';
          btn.onclick = async ()=>{
            if(btn.dataset.expanded==='1'){
              // collapse
              if(li.querySelector('ul')) li.removeChild(li.querySelector('ul'));
              btn.textContent='展開'; btn.dataset.expanded='0';
            } else {
              btn.textContent='載入中…';
              try{
                const children = await fetchContents(item.path, branch);
                const ul = document.createElement('ul'); ul.className='list'; ul.style.marginTop='8px'; ul.style.paddingLeft='12px';
                renderList(children, ul, branch);
                li.appendChild(ul);
                btn.textContent='收起'; btn.dataset.expanded='1';
              }catch(e){
                btn.textContent='錯誤';
                console.error(e);
              }
            }
          };
          right.appendChild(btn);
        } else {
          const a = document.createElement('a');
          a.href = makeFileLink(item.path);
          a.target = '_blank';
          a.className = 'file-link';
          a.textContent = '在新分頁開啟';
          right.appendChild(a);
          const g = document.createElement('a');
          g.href = makeGitHubBlobLink(item.path, branch);
          g.target = '_blank';
          g.style.marginLeft='8px';
          g.className='meta';
          g.textContent='GitHub';
          right.appendChild(g);
        }
        li.appendChild(right);
        parentEl.appendChild(li);
      });
    }

    async function load(){
      try{
        treeEl.innerHTML='';
        readmeEl.innerHTML='載入 README.md…';
        const branch = await getDefaultBranch();
        repoInfoEl.textContent = `branch: ${branch}`;
        const root = await fetchContents('', branch);
        if(Array.isArray(root)){
          renderList(root, treeEl, branch);
        } else {
          treeEl.innerHTML = '<li class="empty">找不到目錄內容</li>';
        }

        // 尋找 README 檔案 (大小寫不定)
        const readmeItem = root.find(x=>/^readme(\.|$)/i.test(x.name));
        if(readmeItem){
          // 取得 raw 內容
          const rawUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${readmeItem.path}`;
          const md = await fetch(rawUrl).then(r=>r.ok? r.text(): '無法讀取 README');
          readmeEl.innerHTML = marked.parse(md || '');
        } else {
          readmeEl.innerHTML = '<div class="empty">此專案沒有 README.md</div>';
        }
      }catch(e){
        console.error(e);
        treeEl.innerHTML = '<li class="empty">載入失敗，請稍後重試</li>';
        readmeEl.innerHTML = '<div class="empty">README 載入失敗</div>';
        repoInfoEl.textContent = '';
      }
    }

    refreshBtn.addEventListener('click', ()=> load());
    // 初始載入
    load();
  </script>
</body>
</html>
